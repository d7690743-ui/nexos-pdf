plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexos.pdf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexos.pdf'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Solo AppCompat (para el selector de archivos). La página y pdf-lib van en assets.
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
